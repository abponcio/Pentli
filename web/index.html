<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Plentli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    .hero { display: grid; gap: 10px; padding-block: 8px 4px; }
    .hero h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.6rem); line-height: 1.1; }
    .screens { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .screens a { display: flex; gap: 14px; align-items: center; text-decoration: none; color: var(--ink); min-block-size: 48px; }
    .screens a .grow { flex: 1; min-inline-size: 0; display: grid; gap: 2px; }
    .qr-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .qr-row img { background: #fff; padding: 8px; border-radius: 10px; border: 1px solid var(--border); flex: none; }
    .qr-row > div { min-inline-size: 0; flex: 1; display: grid; gap: 4px; }
    #judge-link { overflow-wrap: anywhere; }
    .side-reset { display: flex; justify-content: flex-end; }
    .side-reset .linkbtn { font-size: 0.85rem; }
  </style>
</head>
<body>
  <main class="page narrow stack" id="main">
    <section class="hero">
      <h1 data-t="hero">Good food. More people.</h1>
      <p class="muted" data-t="hero_sub"></p>
    </section>
    <nav class="screens" aria-label="Screens" id="screens"></nav>
    <section class="card qr-row">
      <img id="qrcode" alt="" width="128" height="128">
      <div>
        <strong data-t="judge_title"></strong>
        <span class="muted" data-t="judge_hint"></span>
        <a id="judge-link" href="/coordinator?r=r3" dir="ltr">/coordinator?r=r3</a>
      </div>
    </section>
    <div class="side-reset"><button class="linkbtn" type="button" id="reset"></button></div>
  </main>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="/static/icons.js"></script>
  <script src="/static/app.js"></script>
  <script>
    addStrings({
      hero: "Good food. More people.",
      hero_sub: "A kitchen sends one message. Plentli works out what the food is, how long it stays safe, who can use it, and which van can get it there in time. Code enforces every food-safety rule.",
      s_chat: "Donor chat", s_chat_sub: "Mohsen shares surplus by chat, photo or voice",
      s_rec: "Recipient", s_rec_sub: "Hope Family Shelter accepts or declines an offer",
      s_drv: "Driver message", s_drv_sub: "HelloChef van 03 gets the pickup and drops",
      s_live: "Live rescue", s_live_sub: "Map, allocation, safety clock and activity",
      s_imp: "Impact", s_imp_sub: "Meals received and handover record",
      judge_title: "Try the recipient view", judge_hint: "Scan to open Hope Family Shelter on your phone.",
      reset: "Reset data", reset_confirm: "Clear all rescues and start a fresh run on every screen?", reset_done: "Data reset",
    }, {
      hero: "طعام جيد. لعدد أكبر من الناس.",
      hero_sub: "يرسل المطبخ رسالة واحدة. يحدد Plentli نوع الطعام ومدة بقائه آمناً ومن يمكنه الاستفادة منه وأي شاحنة توصله في الوقت المناسب. قواعد سلامة الغذاء يطبقها الكود.",
      s_chat: "محادثة المتبرع", s_chat_sub: "يشارك محسن الفائض بالرسالة أو الصورة أو الصوت",
      s_rec: "الجهة المستفيدة", s_rec_sub: "يقبل ملجأ الأمل للعائلات العرض أو يرفضه",
      s_drv: "رسالة السائق", s_drv_sub: "تستلم شاحنة HelloChef رقم 03 الاستلام ونقاط التوصيل",
      s_live: "الإنقاذ المباشر", s_live_sub: "الخريطة والتوزيع ووقت السلامة والنشاط",
      s_imp: "الأثر", s_imp_sub: "الوجبات المستلمة وسجل التسليم",
      judge_title: "جرّب واجهة الجهة المستفيدة", judge_hint: "امسح الرمز لفتح ملجأ الأمل للعائلات على هاتفك.",
      reset: "إعادة ضبط البيانات", reset_confirm: "مسح كل عمليات الإنقاذ والبدء من جديد على كل الشاشات؟", reset_done: "تمت إعادة ضبط البيانات",
    });

    const SCREENS = [
      ["/kitchen", "message-circle", "s_chat"], ["/coordinator?r=r3", "building-2", "s_rec"],
      ["/driver?d=d1", "truck", "s_drv"], ["/ops", "map-pin", "s_live"], ["/ops#impact", "chart-column", "s_imp"],
    ];
    function render() {
      document.getElementById("screens").replaceChildren(...SCREENS.map(([href, ic, key]) =>
        el("a", { class: "card", href }, el("span", { class: "bubble-icon" }, icon(ic, 22)),
          el("span", { class: "grow" }, el("strong", {}, t(key)), el("span", { class: "muted small" }, t(key + "_sub"))),
          icon(AR() ? "arrow-left" : "chevron-right", 20))));
      document.getElementById("reset").replaceChildren(icon("rotate-ccw", 16), el("span", {}, t("reset")));
    }

    mountHeader({ nav: null, tagline: true });
    mountFooter();
    render();
    document.addEventListener("langchange", render);
    (async () => {
      const cfg = await api("/api/config");
      const url = `${cfg.public_base_url || location.origin}/coordinator?r=r3`;
      const link = document.getElementById("judge-link");
      link.href = url; link.textContent = url;
      document.getElementById("qrcode").src = `/api/qr.svg?url=${encodeURIComponent(url)}`;
    })();
    document.getElementById("reset").addEventListener("click", async () => {
      if (!confirm(t("reset_confirm"))) return;
      await postJSON("/api/reset", {});
      alertUser(t("reset_done"));
    });
  </script>
</body>
</html>

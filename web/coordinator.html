<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Plentli · Recipient offer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/app.css">
  <style>
    body { background: var(--white); }
    .screen { display: grid; gap: 16px; }
    .centered { text-align: center; display: grid; justify-items: center; gap: 10px; }
    .centered .lede { color: var(--muted); font-size: 1.15rem; max-inline-size: 30ch; }
    .hero-icon { inline-size: 96px; block-size: 96px; border-radius: 50%; display: grid; place-items: center; background: var(--green); color: var(--white); }
    .hero-icon.grey { background: var(--grey); color: var(--grey-ink); }
    .hero-icon.amber { background: var(--amber); color: var(--amber-ink); }
    .hero-icon.sage { background: var(--sage); color: var(--forest); }
    .photo { inline-size: 100%; aspect-ratio: 16 / 7; object-fit: cover; border-radius: 14px; background: var(--sage); }
    .food { display: flex; gap: 14px; align-items: center; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius-card); text-align: start; inline-size: 100%; }
    .food img, .food .ph { inline-size: 96px; block-size: 84px; flex: none; object-fit: cover; border-radius: 10px; background: var(--sage); display: grid; place-items: center; color: var(--green); }
    .food .grow { flex: 1; min-inline-size: 0; display: grid; gap: 6px; justify-items: start; }
    .food strong { font-family: var(--font-display); font-size: 1.15rem; }
    .eta-big { font-family: var(--font-display); font-weight: 800; font-size: 3.2rem; line-height: 1; }
    .expiry { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; background: var(--sage); }
    .expiry .grow { flex: 1; }
    .expiry .count { font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; font-variant-numeric: tabular-nums; }
    .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; text-align: start; inline-size: 100%; }
    .steps li { display: flex; gap: 14px; position: relative; padding-block-end: 20px; }
    .steps li:not(:last-child)::after { content: ""; position: absolute; inset-inline-start: 15px; inset-block-start: 34px; inset-block-end: 2px; inline-size: 2px; background: var(--border); }
    .steps .dot { inline-size: 32px; block-size: 32px; flex: none; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--border); background: var(--white); color: var(--white); }
    .steps .done .dot { background: var(--green); border-color: var(--green); }
    .steps .now .dot { border-color: var(--green); box-shadow: inset 0 0 0 6px var(--white); background: var(--green); }
    .steps strong { display: block; }
    .steps .now strong { font-weight: 700; }
    .rows { border: 1px solid var(--border); border-radius: var(--radius-card); padding: 4px 16px; text-align: start; inline-size: 100%; }
    .picker { display: grid; gap: 10px; }
  </style>
</head>
<body>
  <main class="narrow" id="main"></main>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="/static/icons.js"></script>
  <script src="/static/app.js"></script>
  <script>
    addStrings({
      pick_org: "Which organisation are you?", pick_hint: "Demo organisations. Pick one to see its offers.",
      no_offer: "No offers right now", no_offer_hint: "Keep this page open. New food offers appear here.",
      meals_for: (n) => `${n} meals for your community`, arrival: "Arrival", about: "about",
      review: "Review allergens before accepting.", expires_in: "Offer expires in",
      accept_n: (n) => `Accept ${n} meals`, decline: "Decline offer",
      declined_title: "Offer declined", declined_lede: "We will find another home for these meals.",
      no_action: "No action needed", close_page: "You can close this page.",
      expired_title: "This offer has expired", expired_lede: "The meals may have been reassigned.", offer_expired: "Offer expired",
      on_route: "You are on the route", expected: "Expected arrival", waiting_driver: "Waiting for a driver",
      offer_accepted: "Offer accepted", driver_way: "Driver on the way", confirm_receipt: "Confirm receipt",
      on_arrival: "Available on arrival", when_arrives: "Available when delivery arrives.",
      delivery_here: "Your delivery is here", arrived_at: "Arrived at", received_all: (n) => `Have you received all ${n} meals?`,
      confirm_n: (n) => `Confirm ${n} meals received`, report: "Report an issue", check_first: "Confirm only after checking delivery.",
      issue_noted: "Issue noted. The handover stays open and the kitchen has been told.",
      received_title: (n) => `${n} meals received`, thanks: "Thank you for making room.", received: "Received",
      handover: "Handover recorded", view_record: "View handover record", hide_record: "Hide handover record",
      recipient_confirmed: "Recipient confirmed", temperature: "Temperature: Not recorded", impact_after: "Impact counted after receipt",
      unsafe: "Do not serve this food",
      new_offer: "New food offer", confirmed: "Delivery confirmed", arrived_alert: "Your delivery is here",
    }, {
      pick_org: "ما هي جهتك؟", pick_hint: "جهات تجريبية. اختر جهة لرؤية عروضها.",
      no_offer: "لا توجد عروض حالياً", no_offer_hint: "أبقِ هذه الصفحة مفتوحة. ستظهر عروض الطعام الجديدة هنا.",
      meals_for: (n) => `${n} وجبة لمجتمعكم`, arrival: "الوصول", about: "حوالي",
      review: "راجع مسببات الحساسية قبل القبول.", expires_in: "ينتهي العرض خلال",
      accept_n: (n) => `قبول ${n} وجبة`, decline: "رفض العرض",
      declined_title: "تم رفض العرض", declined_lede: "سنجد جهة أخرى تستفيد من هذه الوجبات.",
      no_action: "لا حاجة لأي إجراء", close_page: "يمكنك إغلاق هذه الصفحة.",
      expired_title: "انتهت صلاحية هذا العرض", expired_lede: "ربما أُعيد توزيع الوجبات.", offer_expired: "انتهى العرض",
      on_route: "أنتم ضمن المسار", expected: "الوصول المتوقع", waiting_driver: "بانتظار سائق",
      offer_accepted: "تم قبول العرض", driver_way: "السائق في الطريق", confirm_receipt: "تأكيد الاستلام",
      on_arrival: "متاح عند الوصول", when_arrives: "متاح عند وصول التوصيلة.",
      delivery_here: "وصلت توصيلتكم", arrived_at: "وصلت الساعة", received_all: (n) => `هل استلمتم كل الوجبات الـ${n}؟`,
      confirm_n: (n) => `تأكيد استلام ${n} وجبة`, report: "الإبلاغ عن مشكلة", check_first: "أكّدوا فقط بعد فحص التوصيلة.",
      issue_noted: "تم تسجيل المشكلة. يبقى التسليم مفتوحاً وتم إبلاغ المطبخ.",
      received_title: (n) => `تم استلام ${n} وجبة`, thanks: "شكراً لاستقبالكم الطعام.", received: "تم الاستلام",
      handover: "تم تسجيل التسليم", view_record: "عرض سجل التسليم", hide_record: "إخفاء سجل التسليم",
      recipient_confirmed: "أكّدت الجهة المستلمة", temperature: "درجة الحرارة: غير مسجلة", impact_after: "يُحتسب الأثر بعد الاستلام",
      unsafe: "لا تقدموا هذا الطعام",
      new_offer: "عرض طعام جديد", confirmed: "تم تأكيد التوصيل", arrived_alert: "وصلت توصيلتكم",
    });
    const tf = (key, ...args) => { const v = t(key); return typeof v === "function" ? v(...args) : v; };

    const RID = new URLSearchParams(location.search).get("r");
    const main = document.getElementById("main");
    let me = null, world = null;
    let cur = null;          // { rescueId, offer, stop, arrived, received, receivedAt, unsafeTexts, issue }
    let showRecord = false;

    function chipOrg() { return el("div", {}, el("span", { class: "chip label" }, localName(me))); }
    function footer() { return el("p", { class: "hint", style: "margin-block-start:8px" }, t("footer")); }

    function photoFor(rescueId, cls) {
      return foodPhoto(rescueId, { class: cls, alt: "Photo of the donated food" }, () => el("div", { class: cls === "photo" ? "photo hidden" : "ph" }, icon("utensils", 28)));
    }

    function foodCard(o, portions, extra) {
      return el("div", { class: "food" }, photoFor(o.rescue_id, ""),
        el("div", { class: "grow" }, el("strong", {}, `${portions} × ${cap(dishName(o))}`), extra));
    }

    function row(ic, label, value, tone) {
      return el("div", { class: "row" }, el("span", { class: `bubble-icon ${tone || ""}` }, icon(ic, 20)),
        el("span", { class: "grow" }, label), value ?? null);
    }

    function fmtCount(sec) { const s = Math.max(0, Math.ceil(sec)); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }

    function render() {
      document.title = me ? `Plentli · ${me.name}` : "Plentli · Recipient offer";
      if (!me) return renderPicker();
      const screen = el("div", { class: "screen" });
      if (cur && cur.unsafeTexts) screen.append(el("div", { class: "notice amber", role: "alert" }, icon("triangle-alert", 24), el("div", { class: "grow" }, el("strong", {}, t("unsafe")), el("p", { dir: "auto" }, pickText(cur.unsafeTexts)))));
      if (!cur || !cur.offer) screen.append(renderEmpty());
      else if (cur.received) screen.append(...renderReceived());
      else if (cur.arrived) screen.append(...renderArrived());
      else if (cur.offer.status === "accepted") screen.append(...renderAccepted());
      else if (cur.offer.status === "declined") screen.append(...renderDeclined());
      else if (cur.offer.status === "expired") screen.append(...renderExpired());
      else screen.append(...renderOffer());
      screen.append(footer());
      main.replaceChildren(screen);
    }

    function renderPicker() {
      main.replaceChildren(el("div", { class: "screen" }, el("h1", {}, t("pick_org")), el("p", { class: "muted" }, t("pick_hint")),
        el("div", { class: "picker" }, world.recipients.map((r) => el("a", { class: "btn block", href: `/coordinator?r=${r.id}` }, localName(r))))), footer());
    }

    function renderEmpty() {
      return el("div", { class: "centered", style: "padding-block:40px 8px" }, chipOrg(),
        el("div", { class: "hero-icon sage" }, icon("clock", 44)), el("h1", {}, t("no_offer")), el("p", { class: "lede" }, t("no_offer_hint")), alertsButton());
    }

    function renderOffer() {
      const o = cur.offer;
      const left = (o.expires_at_ts || 0) - Date.now() / 1000;
      return [chipOrg(), el("h1", {}, tf("meals_for", o.portions)),
        photoFor(o.rescue_id, "photo"),
        el("div", {}, el("h2", {}, cap(dishName(o))), el("p", { class: "muted" }, t("from_kitchen"))),
        el("div", {}, el("span", { class: "chip amber" }, icon("triangle-alert", 18), cap(allergenText(o.allergens)))),
        el("div", {},
          row("clock", t("arrival"), el("span", { class: "value" }, ltr(o.eta))),
          row("clock", t("serve_by"), el("span", { class: "value" }, ltr(o.safe_until), " ", el("span", { class: "demo-rule" }, t("demo_rule")))),
          row("leaf", t("halal"), el("span", { class: "muted small" }, t("donor_declared")))),
        el("p", { class: "muted small" }, t("review")),
        el("div", { class: "expiry", "aria-live": "off" }, icon("clock", 22), el("span", { class: "grow" }, t("expires_in")), el("span", { class: "count", id: "count" }, fmtCount(left))),
        el("button", { class: "btn primary block", type: "button", onclick: (ev) => respond(ev, "accept") }, tf("accept_n", o.portions)),
        el("button", { class: "btn block", type: "button", onclick: (ev) => respond(ev, "decline") }, t("decline"))];
    }

    function renderDeclined() {
      const o = cur.offer;
      return [el("div", { class: "centered" }, el("div", { class: "hero-icon grey" }, icon("minus", 44)), el("span", { class: "muted" }, localName(me)),
        el("h1", {}, t("declined_title")), el("p", { class: "lede" }, t("declined_lede")),
        foodCard(o, o.portions, el("span", { class: "muted" }, `${t("rescue")} `, ltr(o.rescue_id)))),
        el("div", { class: "notice" }, icon("info", 24), el("div", { class: "grow" }, el("strong", {}, t("no_action")), el("p", { class: "muted" }, t("close_page"))))];
    }

    function renderExpired() {
      const o = cur.offer;
      return [el("div", { class: "centered" }, el("div", { class: "hero-icon amber" }, icon("clock", 44)), el("span", { class: "muted" }, localName(me)),
        el("h1", {}, t("expired_title")), el("p", { class: "lede" }, t("expired_lede")),
        foodCard(o, o.portions, el("span", { class: "muted" }, `${t("rescue")} `, ltr(o.rescue_id)))),
        el("button", { class: "btn block", type: "button", disabled: true }, t("offer_expired"))];
    }

    function renderAccepted() {
      const o = cur.offer, s = cur.stop;
      const eta = s ? s.eta_hhmm : o.eta;
      return [chipOrg(), el("div", { class: "centered" }, el("div", { class: "hero-icon" }, icon("check", 48)),
        el("h1", {}, t("on_route")), el("span", { class: "muted" }, t("expected")), el("div", { class: "eta-big" }, ltr(eta)),
        foodCard(o, o.portions, [el("span", { class: "muted" }, t("from_kitchen")), el("span", { class: "chip amber" }, icon("triangle-alert", 16), cap(allergenText(o.allergens)))]),
        el("ol", { class: "steps" },
          el("li", { class: "done" }, el("span", { class: "dot" }, icon("check", 16)), el("div", {}, el("strong", {}, t("offer_accepted")), el("span", { class: "muted" }, ltr((o.responded_at || "").slice(11, 16))))),
          el("li", { class: s ? "now" : "" }, el("span", { class: "dot" }), el("div", {}, el("strong", {}, s ? t("driver_way") : t("waiting_driver")), s ? el("span", { class: "muted" }, `${t("eta")} `, ltr(s.eta_hhmm)) : null)),
          el("li", {}, el("span", { class: "dot" }), el("div", {}, el("strong", {}, t("confirm_receipt")), el("span", { class: "muted" }, t("on_arrival")))))),
        el("button", { class: "btn block", type: "button", disabled: true }, t("confirm_receipt")),
        el("p", { class: "hint" }, t("when_arrives"))];
    }

    function renderArrived() {
      const o = cur.offer, s = cur.stop || {};
      const portions = s.portions || o.portions;
      const out = [el("div", { class: "centered" }, el("div", { class: "hero-icon sage" }, icon("truck", 44)), el("span", { class: "muted" }, localName(me)),
        el("h1", {}, t("delivery_here")),
        el("span", { class: "chip" }, icon("circle-check", 18), `${t("arrived_at")} `, ltr(s.delivered_at || "")),
        foodCard(o, portions, [el("span", { class: "chip amber" }, icon("triangle-alert", 16), cap(allergenText(o.allergens))),
          el("span", { class: "muted small" }, `${t("serve_by")} `, ltr(o.safe_until), ` · ${t("demo_rule")}`)])),
        el("h2", {}, tf("received_all", portions))];
      if (cur.issue) out.push(el("div", { class: "notice amber", role: "status" }, icon("info", 22), el("span", { class: "grow" }, t("issue_noted"))));
      out.push(el("button", { class: "btn primary block", type: "button", onclick: confirmReceived }, tf("confirm_n", portions)),
        el("button", { class: "btn block", type: "button", onclick: () => { cur.issue = true; render(); } }, t("report")),
        el("p", { class: "hint" }, t("check_first")));
      return out;
    }

    function renderReceived() {
      const o = cur.offer, s = cur.stop || {};
      const portions = s.portions || o.portions;
      const out = [chipOrg(), el("div", { class: "centered" }, el("div", { class: "hero-icon" }, icon("check", 48)),
        el("h1", {}, tf("received_title", portions)), el("p", { class: "lede" }, t("thanks"))),
        el("div", { class: "rows" },
          row("file-text", t("rescue"), el("span", { class: "value" }, ltr(o.rescue_id))),
          row("utensils", cap(dishName(o))),
          el("div", { class: "row" }, el("span", { class: "chip amber" }, icon("triangle-alert", 18), cap(allergenText(o.allergens)))),
          row("clock", t("received"), el("span", { class: "value" }, ltr(cur.receivedAt || ""))),
          row("users", localName(me))),
        el("div", { class: "notice" }, el("span", { class: "bubble-icon solid" }, icon("check", 20)), el("strong", { class: "grow" }, t("handover"))),
        el("button", { class: "linkbtn", type: "button", "aria-expanded": String(showRecord), onclick: () => { showRecord = !showRecord; render(); } },
          showRecord ? t("hide_record") : t("view_record"), icon(showRecord ? "minus" : (AR() ? "arrow-left" : "chevron-right"), 18))];
      if (showRecord) {
        out.push(el("div", { class: "rows" },
          row("users", localName(me)), row("utensils", `${portions} ${t("meals")} · ${cap(dishName(o))}`),
          row("triangle-alert", cap(allergenText(o.allergens)), null, "amber"),
          row("clock", t("received"), el("span", { class: "value" }, ltr(cur.receivedAt || ""))),
          row("check", t("recipient_confirmed")),
          row("thermometer", t("temperature"), null, "grey"),
          row("info", t("impact_after"), null, "grey")));
      }
      return out;
    }

    async function respond(ev, decision) {
      ev.target.disabled = true;
      try { const res = await postJSON(`/api/offers/${cur.offer.id}/respond`, { decision }); cur.offer = res.offer; render(); }
      catch { alertUser(t("offer_expired"), ""); ev.target.disabled = false; }
    }

    async function confirmReceived(ev) {
      ev.target.disabled = true;
      try {
        const res = await postJSON("/api/stops", { rescue_id: cur.rescueId, stop_id: RID, action: "received" });
        const s = res.route.stops.find((x) => x.id === RID);
        cur.received = true; cur.receivedAt = s && s.received_at; render();
      } catch (err) { ev.target.disabled = false; alertUser("Error", err.message); }
    }

    function forRescue(rescueId) {
      if (!cur || cur.rescueId !== rescueId) cur = { rescueId };
      return cur;
    }

    function onEvent(e) {
      if (e.kind === "reset") { cur = null; showRecord = false; render(); return; }
      if (e.kind === "message" && e.offer) {
        const c = forRescue(e.rescue_id);
        c.offer = e.offer; c.issue = false;
        alertUser(t("new_offer"), pickText(e.texts), e);
      } else if (e.kind === "offer") {
        const c = forRescue(e.rescue_id);
        if (!c.offer || c.offer.id === e.offer.id || e.offer.status === "pending") c.offer = e.offer;
      } else if (e.kind === "message" && e.stop) {
        forRescue(e.rescue_id).stop = e.stop;
        alertUser(t("confirmed"), pickText(e.texts), e);
      } else if (e.kind === "arrived") {
        const c = forRescue(e.rescue_id);
        c.stop = { ...(c.stop || {}), ...e.stop }; c.arrived = true;
        alertUser(t("arrived_alert"), "", e);
      } else if (e.kind === "received") {
        const c = forRescue(e.rescue_id);
        c.stop = { ...(c.stop || {}), ...e.stop }; c.arrived = true; c.received = true; c.receivedAt = e.stop.received_at;
      } else if (e.kind === "message" && e.alert) {
        forRescue(e.rescue_id).unsafeTexts = e.texts;
        alertUser(t("unsafe"), pickText(e.texts), e);
      } else return;
      render();
    }

    (async () => {
      mountHeader({ tagline: false });
      world = await api("/api/state");
      me = world.recipients.find((r) => r.id === RID) || null;
      document.addEventListener("langchange", render);
      render();
      if (me) listen(`recipient:${RID}`, onEvent);
      setInterval(() => {
        const count = document.getElementById("count");
        if (count && cur && cur.offer) count.textContent = fmtCount((cur.offer.expires_at_ts || 0) - Date.now() / 1000);
      }, 1000);
    })();
  </script>
</body>
</html>
